name: Diagnose pirate wave progress in Android WebView
on:
  workflow_dispatch:
    inputs:
      apk_run:
        type: string
        default: '44783470266'
      baseline:
        type: boolean
        default: false
      legacy_resources:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Probe the existing APK without rebuilding or publishing it
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN: ${{ inputs.apk_run }}
          PROBE_BASELINE: ${{ inputs.baseline }}
          PROBE_LEGACY_RESOURCES: ${{ inputs.legacy_resources }}
        run: bash scripts/probe-android-wave.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-wave-results
          path: work/wave-results
