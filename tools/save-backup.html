<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Gardendless 存档拆分</title>
<style>body{font:18px/1.7 system-ui,sans-serif;background:#f7f8f3;color:#203124;margin:0;padding:32px 20px}main{max-width:700px;margin:auto}h1{font-size:30px}input,button{font:inherit;max-width:100%}button{display:block;margin:10px 0 24px;padding:12px 18px;background:#245e3b;color:white;border:0;border-radius:8px}li{margin:22px 0}#status{white-space:pre-wrap}small{color:#486050}</style>
<main><h1>存档拆分</h1>
<p>选择应用导出的“全部玩家”JSON 备份，为每位玩家生成原游戏能导入的单独存档。原备份文件保持不变。</p>
<p><small>全部处理都在此页面内完成，无需联网。不会修改游戏中的数据。</small></p>
<label for="backup">选择备份文件</label><p><input id="backup" type="file" accept=".json,application/json"></p>
<p id="status" role="status" aria-live="polite"></p><ol id="players"></ol>
<p>保存单个玩家文件后，进入游戏的玩家选择界面，使用原有“导入存档”功能。全部玩家备份是一个列表，请先拆分后再导入。导入前保留当前存档副本。</p></main>
<script id="save-format">
globalThis.PvzSaveBackup = {
  split(raw) {
    const players = JSON.parse(raw);
    if (!Array.isArray(players) || players.length === 0 ||
        players.some(p => !p || typeof p !== 'object' || Array.isArray(p))) {
      throw new Error('请选择应用导出的全部玩家 JSON 备份。');
    }
    return players.map((player, index) => ({
      name: typeof player.name === 'string' && player.name ? player.name : '玩家 ' + (index + 1),
      json: JSON.stringify(player, null, '\t')
    }));
  }
};
</script>
<script>
const picker = document.getElementById('backup');
const status = document.getElementById('status');
const list = document.getElementById('players');
picker.addEventListener('change', async () => {
  list.replaceChildren(); status.textContent = '';
  const file = picker.files[0]; if (!file) return;
  try {
    if (file.size > 16 * 1024 * 1024) throw new Error('文件超过 16 MB，请检查是否选错文件。');
    const players = PvzSaveBackup.split(await file.text());
    status.textContent = '读取成功：' + players.length + ' 位玩家。请分别保存需要恢复的存档。';
    players.forEach((player, index) => {
      const row = document.createElement('li');
      const label = document.createElement('strong'); label.textContent = player.name;
      const button = document.createElement('button'); button.textContent = '保存此玩家的可导入存档';
      button.addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([player.json], {type:'application/json'}));
        const link = document.createElement('a'); link.href = url;
        link.download = 'player-' + (index + 1) + '-' + player.name.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 80) + '.json';
        link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      row.append(label, button); list.append(row);
    });
  } catch (error) { status.textContent = '无法读取：' + error.message; }
});
</script></html>
